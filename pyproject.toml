[project]
name = "project-halcyon"
version = "0.1.0"
description = "Textual MIDI controller, synth, and drum experiment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.44.0",
    "python-rtmidi>=1.5.8",
    "textual>=6.0.0",
]

[project.scripts]
halcyon = "halcyon.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halcyon"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Modules", "halcyon.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
