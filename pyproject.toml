[project]
name = "project-halcyon"
version = "0.1.0"
description = "Textual MIDI controller, synth, and drum experiment."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.6,<26",
    "mido>=1.3.3,<2",
    "openai>=2.44.0",
    "python-rtmidi>=1.5.8",
    "textual>=6.0.0",
]

[project.scripts]
halcyon = "halcyon.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halcyon"]

[tool.uv]
# Avoid stripped Mach-O wheels with misaligned LINKEDIT on macOS 27.
no-binary-package = ["pydantic-core", "jiter"]

[tool.uv.extra-build-variables]
pydantic-core = { CARGO_PROFILE_RELEASE_STRIP = "none", CARGO_PROFILE_RELEASE_DEBUG = "1" }
jiter = { CARGO_PROFILE_RELEASE_STRIP = "none", CARGO_PROFILE_RELEASE_DEBUG = "1" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Modules", "halcyon.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
