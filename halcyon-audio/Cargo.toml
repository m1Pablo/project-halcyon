[workspace]
resolver = "2"
members = [
    "crates/halcyon-audio-core",
    "crates/halcyon-audio-sidecar",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pablomendoza/project-halcyon"

[workspace.dependencies]
cpal = "0.15"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
